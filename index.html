function initTheme() {
  const savedTheme = localStorage.getItem('york_theme') || 'dark';
  applyTheme(savedTheme);
}

function applyTheme(theme) {
  const html = document.documentElement;
  const icon = document.getElementById('themeIcon');
  const text = document.getElementById('themeText');
  if (theme === 'dark') {
    html.classList.add('dark');
    if (icon) icon.innerText = '🌙';
    if (text) text.innerText = '深色模式';
  } else {
    html.classList.remove('dark');
    if (icon) icon.innerText = '☀️';
    if (text) text.innerText = '淺色模式';
  }
  localStorage.setItem('york_theme', theme);
}

function toggleTheme() {
  const isDark = document.documentElement.classList.contains('dark');
  applyTheme(isDark ? 'light' : 'dark');
}

function save() {
  localStorage.setItem('york_ai_dash_v18', JSON.stringify(state));
  render();
  if (ghConfig.token) {
    pushToGitHub(false);
  }
}

function updateSyncUI(status, msg) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (status === 'synced') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-500/30';
    el.innerText = '✅ GitHub 已同步';
  } else if (status === 'syncing') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-indigo-100 dark:bg-indigo-950/80 text-indigo-800 dark:text-indigo-300 border border-indigo-300 dark:border-indigo-500/30 animate-pulse';
    el.innerText = '🔄 推送中...';
  } else if (status === 'error') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-rose-100 dark:bg-rose-950/80 text-rose-800 dark:text-rose-300 border border-rose-300 dark:border-rose-500/30';
    el.innerText = '⚠️ 同步失敗: ' + (msg || '');
  } else {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800';
    el.innerText = ghConfig.token ? '⚡ 已配置 Token' : '⚠️ 未配置 Token (僅本機)';
  }
}

async function pushToGitHub(showAlert = false) {
  if (!ghConfig.token) {
    if (showAlert) openModal();
    return;
  }
  updateSyncUI('syncing');

  try {
    const timestamp = Date.now();
    const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/index.html?ref=${ghConfig.branch}&_t=${timestamp}`;
    const headers = {
      'Authorization': `Bearer ${ghConfig.token}`,
      'Accept': 'application/vnd.github.v3+json'
    };

    const getRes = await fetch(url, { headers, cache: 'no-store' });
    let currentSha = null;
    let remoteContent = '';

    if (getRes.ok) {
      const data = await getRes.json();
      currentSha = data.sha;
      remoteContent = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
    } else if (getRes.status !== 404) {
      throw new Error(`無法連接 Repo (Status: ${getRes.status})`);
    }

    let baseHtml = remoteContent || document.documentElement.outerHTML;
    const stateMarkerRegex = /(const DEFAULT_DATA = )\{[\s\S]*?\n\};/;
    if (stateMarkerRegex.test(baseHtml)) {
      baseHtml = baseHtml.replace(stateMarkerRegex, `$1${JSON.stringify(state, null, 2)};`);
    }

    const utf8Bytes = new TextEncoder().encode(baseHtml);
    let binary = '';
    utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const base64Content = btoa(binary);

    const putUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/index.html`;
    const body = {
      message: 'Dashboard Auto-sync: ' + new Date().toLocaleString(),
      content: base64Content,
      branch: ghConfig.branch
    };
    if (currentSha) body.sha = currentSha;

    const putRes = await fetch(putUrl, {
      method: 'PUT',
      headers,
      body: JSON.stringify(body)
    });

    if (!putRes.ok) {
      const err = await putRes.json();
      throw new Error(err.message || '寫入失敗');
    }

    updateSyncUI('synced');
    if (showAlert) alert('已成功推送至 GitHub！');
  } catch (err) {
    updateSyncUI('error', err.message);
    if (showAlert) alert('同步失敗: ' + err.message);
  }
}

function openModal() {
  const modal = document.getElementById('ghModal');
  if (modal) {
    document.getElementById('ghOwner').value = ghConfig.owner || 'yorkleung0512-ops';
    document.getElementById('ghRepo').value = ghConfig.repo || 'ai-dashboard';
    document.getElementById('ghBranch').value = ghConfig.branch || 'main';
    document.getElementById('ghToken').value = ghConfig.token || '';
    modal.style.display = 'flex';
  }
}
function closeModal() {
  const modal = document.getElementById('ghModal');
  if (modal) modal.style.display = 'none';
}

function filterProject(id) { activeProject = id; render(); }
function setTab(tab) {
  currentTab = tab;
  ['tabFocus', 'tabKanban', 'tabRoadmap'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const active = (tab === 'focus' && id === 'tabFocus') ||
                   (tab === 'kanban' && id === 'tabKanban') ||
                   (tab === 'roadmap' && id === 'tabRoadmap');
    el.className = active
      ? 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white cursor-pointer shadow-sm'
      : 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer';
  });
  render();
}

function toggleSubtask(taskId, idx) {
  const t = state.tasks.find(x => x.id === taskId);
  if (t && t.subtasks[idx]) {
    t.subtasks[idx].done = !t.subtasks[idx].done;
    save();
  }
}
function changeStatus(taskId, s) {
  const t = state.tasks.find(x => x.id === taskId);
  if (t) { t.status = s; save(); }
}
function changePhase(taskId, p) {
  const t = state.tasks.find(x => x.id === taskId);
  if (t) { t.phase = parseInt(p); save(); }
}

function addSubtask(taskId) {
  const text = prompt('輸入 Sub-task 名稱：');
  if (!text) return;
  const aiTool = prompt('負責 AI 工具：', 'Gemini API') || 'AI';
  const t = state.tasks.find(x => x.id === taskId);
  if (t) {
    t.subtasks.push({ text, aiTool, done: false });
    save();
  }
}

function getProjectProgress(projId) {
  const pTasks = state.tasks.filter(t => t.projectId === projId);
  let total = 0, done = 0;
  pTasks.forEach(t => {
    (t.subtasks || []).forEach(s => {
      total++;
      if (s.done) done++;
    });
  });
  return total === 0 ? 0 : Math.round((done / total) * 100);
}

function renderTaskCard(t) {
  const proj = state.projects.find(p => p.id === t.projectId) || { name: t.projectId };
  const subHtml = (t.subtasks || []).map((s, i) => `
    <div class="flex items-start justify-between gap-2 text-xs py-1.5 border-b border-slate-100 dark:border-slate-800/40 last:border-0">
      <label class="flex items-start gap-2 cursor-pointer flex-1 ${s.done ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-200'}">
        <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask('${t.id}', ${i})" class="mt-0.5 rounded bg-white dark:bg-slate-950 border-slate-300 dark:border-slate-700 text-indigo-600 focus:ring-0">
        <span>${s.text}</span>
      </label>
      <span class="text-[10px] mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-900 text-indigo-700 dark:text-indigo-300 border border-slate-200 dark:border-slate-800 whitespace-nowrap">${s.aiTool || 'AI'}</span>
    </div>
  `).join('');

  return `
    <div class="panze-card rounded-xl p-4 space-y-3.5 transition">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-950/80 text-indigo-700 dark:text-indigo-300 border border-slate-200 dark:border-slate-800">${proj.name}</span>
          <select onchange="changePhase('${t.id}', this.value)" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-[10px] rounded px-1.5 py-0.5 text-slate-600 dark:text-slate-400">
            <option value="1" ${t.phase===1?'selected':''}>P1 需求</option>
            <option value="2" ${t.phase===2?'selected':''}>P2 MVP</option>
            <option value="3" ${t.phase===3?'selected':''}>P3 實測</option>
            <option value="4" ${t.phase===4?'selected':''}>P4 變現</option>
          </select>
        </div>
        <select onchange="changeStatus('${t.id}', this.value)" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-[11px] rounded px-2 py-0.5 text-slate-700 dark:text-slate-300">
          <option value="todo" ${t.status==='todo'?'selected':''}>📋 To Do</option>
          <option value="in-progress" ${t.status==='in-progress'?'selected':''}>⚡ In Progress</option>
          <option value="done" ${t.status==='done'?'selected':''}>✅ Done</option>
        </select>
      </div>
      <h4 class="font-bold text-sm text-slate-900 dark:text-white leading-snug">${t.title}</h4>
      ${t.note ? `<div class="text-[11px] text-amber-800 dark:text-amber-300/90 bg-amber-50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-500/20 rounded px-2.5 py-1">📌 ${t.note}</div>` : ''}
      <div class="space-y-1.5 pt-1 border-t border-slate-100 dark:border-slate-800/80">
        <div class="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 mb-1">
          <span class="font-medium text-slate-700 dark:text-slate-300">AI Sub-tasks</span>
          <button onclick="addSubtask('${t.id}')" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300 cursor-pointer">+ 新增細項</button>
        </div>
        <div class="panze-inner rounded-lg p-2.5 border space-y-0.5">${subHtml}</div>
      </div>
    </div>
  `;
}

function render() {
  const pGrid = document.getElementById('projectGrid');
  if (pGrid) {
    pGrid.innerHTML = state.projects.map(p => {
      const pct = getProjectProgress(p.id);
      const isSelected = activeProject === p.id;
      const curPhase = p.currentPhase || 1;
      return `
        <div onclick="filterProject('${p.id}')" class="panze-card cursor-pointer rounded-xl p-4 transition relative flex flex-col justify-between ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/30 bg-indigo-50/50 dark:bg-indigo-950/20' : ''}">
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="font-bold text-sm text-slate-900 dark:text-white">${p.name}</span>
              <span class="text-[11px] mono font-semibold text-indigo-600 dark:text-indigo-400">${pct}%</span>
            </div>
            <!-- 四階段里程碑視覺指示器 -->
            <div class="space-y-1">
              <div class="flex items-center justify-between text-[10px] text-slate-500 dark:text-slate-400 font-medium">
                <span>目前階段</span>
                <span class="text-indigo-600 dark:text-indigo-400 font-bold">${PHASE_NAMES[curPhase]}</span>
              </div>
              <div class="grid grid-cols-4 gap-1">
                ${[1, 2, 3, 4].map(idx => `
                  <div class="h-1.5 rounded-full ${idx <= curPhase ? 'bg-indigo-500' : 'bg-slate-200 dark:bg-slate-800'} transition-colors"></div>
                `).join('')}
              </div>
            </div>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">${p.desc}</p>
          </div>

          <div class="space-y-1.5 pt-3 mt-3 border-t border-slate-100 dark:border-slate-800/80">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">專用 AI 工具鏈：</div>
            <div class="flex flex-wrap gap-1">
              ${p.tools.map(tl => `
                <span class="text-[10px] mono px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300" title="${tl.role}">
                  <span class="text-emerald-600 dark:text-emerald-400">${tl.tool}</span>
                </span>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  const sel = document.getElementById('newProject');
  if (sel && sel.options.length !== state.projects.length) {
    sel.innerHTML = state.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  }

  const fLabel = document.getElementById('filterLabel');
  if (fLabel) fLabel.innerText = activeProject === 'ALL' ? '顯示全部 Projects (5)' : '已過濾專案';

  const filtered = state.tasks.filter(t => activeProject === 'ALL' || t.projectId === activeProject);
  const container = document.getElementById('viewContainer');
  if (!container) return;

  if (currentTab === 'focus') {
    const focusTasks = filtered.filter(t => t.status !== 'done');
    container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${focusTasks.map(renderTaskCard).join('')}</div>`;
  } else if (currentTab === 'kanban') {
    const cols = [{ key: 'todo', label: '📋 To Do' }, { key: 'in-progress', label: '⚡ In Progress' }, { key: 'done', label: '✅ Done' }];
    container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">${cols.map(c => `
      <div class="panze-card rounded-xl p-3.5 space-y-3">
        <div class="font-bold text-xs text-slate-700 dark:text-slate-300 px-1 flex items-center justify-between">
          <span>${c.label}</span>
          <span class="text-[10px] mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-950 text-slate-500 dark:text-slate-400">${filtered.filter(t => t.status === c.key).length}</span>
        </div>
        <div class="space-y-3">${filtered.filter(t => t.status === c.key).map(renderTaskCard).join('')}</div>
      </div>
    `).join('')}</div>`;
  } else if (currentTab === 'roadmap') {
    const phases = [
      { id: 1, name: 'Phase 1: 需求釐清 & 規格定義', desc: '釐清核心用戶價值主張與資料模型' },
      { id: 2, name: 'Phase 2: MVP 原型建置', desc: '使用 AI 工具快速完成可走通之 Demo' },
      { id: 3, name: 'Phase 3: 實測反饋 & 優化', desc: '收集反饋、修復登入與資料計算盲點' },
      { id: 4, name: 'Phase 4: 變現機制驗證', desc: '上線付費方案、流量獲客與跨通路轉化' }
    ];

    container.innerHTML = `
      <div class="space-y-6">
        ${phases.map(ph => {
          const phTasks = filtered.filter(t => (t.phase || 2) === ph.id);
          return `
            <div class="panze-card rounded-xl p-4 space-y-3 border-l-4 ${ph.id === 2 ? 'border-l-indigo-500' : 'border-l-slate-400'}">
              <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 dark:border-slate-800/80 pb-2">
                <div>
                  <h3 class="font-bold text-sm text-slate-900 dark:text-white">${ph.name}</h3>
                  <p class="text-[11px] text-slate-500 dark:text-slate-400">${ph.desc}</p>
                </div>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300">
                  ${phTasks.length} 個任務
                </span>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                ${phTasks.length > 0 ? phTasks.map(renderTaskCard).join('') : '<div class="text-xs text-slate-400 italic py-2 col-span-full">此階段目前尚無任務</div>'}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }
}

window.addEventListener('load', () => {
  initTheme();
  document.getElementById('btnThemeToggle').onclick = toggleTheme;

  document.getElementById('btnGhModal').onclick = openModal;
  document.getElementById('btnCloseModal').onclick = closeModal;
  document.getElementById('btnCancelModal').onclick = closeModal;

  document.getElementById('btnSaveConfig').onclick = () => {
    ghConfig.owner = document.getElementById('ghOwner').value.trim();
    ghConfig.repo = document.getElementById('ghRepo').value.trim();
    ghConfig.branch = document.getElementById('ghBranch').value.trim();
    ghConfig.token = document.getElementById('ghToken').value.trim();
    localStorage.setItem('york_gh_config_v2', JSON.stringify(ghConfig));
    closeModal();
    updateSyncUI();
    if (ghConfig.token) pushToGitHub(true);
  };

  document.getElementById('btnPush').onclick = () => pushToGitHub(true);

  document.getElementById('btnAddTask').onclick = () => {
    const title = document.getElementById('newTitle').value.trim();
    if (!title) return;
    const projectId = document.getElementById('newProject').value;
    const phase = parseInt(document.getElementById('newPhase').value) || 2;
    const aiTool = document.getElementById('newAiTool').value.trim() || 'Gemini API';
    state.tasks.unshift({
      id: 't_' + Date.now(),
      projectId,
      phase,
      title,
      status: 'in-progress',
      note: '',
      subtasks: [{ text: '落實執行方針', aiTool, done: false }]
    });
    document.getElementById('newTitle').value = '';
    document.getElementById('newAiTool').value = '';
    save();
  };

  document.getElementById('tabFocus').onclick = () => setTab('focus');
  document.getElementById('tabKanban').onclick = () => setTab('kanban');
  document.getElementById('tabRoadmap').onclick = () => setTab('roadmap');
  document.getElementById('btnResetFilter').onclick = () => filterProject('ALL');

  render();
  updateSyncUI();
});
</script>
