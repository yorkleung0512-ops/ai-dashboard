function updateSyncUI(status, msg) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (status === 'synced') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-500/30';
    el.innerText = '✅ GitHub 已同步';
  } else if (status === 'syncing') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-indigo-950/80 text-indigo-300 border border-indigo-500/30 animate-pulse';
    el.innerText = '🔄 推送中...';
  } else if (status === 'error') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-rose-950/80 text-rose-300 border border-rose-500/30';
    el.innerText = '⚠️ 同步失敗: ' + (msg || '');
  } else {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-slate-800 text-slate-400 border border-slate-700';
    el.innerText = ghConfig.token ? '⚡ 已配置 Token' : '⚠️ 未配置 Token (僅本機)';
  }
}

// 核心：修復 SHA 衝突與快取問題的 GitHub REST API 推送函式
async function pushToGitHub(showAlert = false) {
  if (!ghConfig.token) {
    if (showAlert) openModal();
    return;
  }
  updateSyncUI('syncing');

  try {
    // 加入時間戳參數及 cache: no-store，避開快取回傳過期 SHA
    const timestamp = Date.now();
    const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/index.html?ref=${ghConfig.branch}&_t=${timestamp}`;
    const headers = {
      'Authorization': `Bearer ${ghConfig.token}`,
      'Accept': 'application/vnd.github.v3+json'
    };

    const getRes = await fetch(url, { headers, cache: 'no-store' });
    let currentSha = null;
    let remoteContent = '';

    if (getRes.ok) {
      const data = await getRes.json();
      currentSha = data.sha;
      // 將遠端 Base64 解碼還原為乾淨文字
      remoteContent = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
    } else if (getRes.status !== 404) {
      throw new Error(`無法連接 Repo (Status: ${getRes.status})`);
    }

    // 替換乾淨的 state 資料區塊，避免序列化動態 DOM 產生衝突
    let baseHtml = remoteContent || document.documentElement.outerHTML;
    const stateMarkerRegex = /(const DEFAULT_DATA = )\{[\s\S]*?\n\};/;
    if (stateMarkerRegex.test(baseHtml)) {
      baseHtml = baseHtml.replace(stateMarkerRegex, `$1${JSON.stringify(state, null, 2)};`);
    }

    const utf8Bytes = new TextEncoder().encode(baseHtml);
    let binary = '';
    utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const base64Content = btoa(binary);

    const putUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/index.html`;
    const body = {
      message: 'Dashboard Auto-sync: ' + new Date().toLocaleString(),
      content: base64Content,
      branch: ghConfig.branch
    };
    if (currentSha) body.sha = currentSha;

    const putRes = await fetch(putUrl, {
      method: 'PUT',
      headers,
      body: JSON.stringify(body)
    });

    if (!putRes.ok) {
      const err = await putRes.json();
      throw new Error(err.message || '寫入失敗');
    }

    updateSyncUI('synced');
    if (showAlert) alert('已成功推送至 GitHub！');
  } catch (err) {
    updateSyncUI('error', err.message);
    if (showAlert) alert('同步失敗: ' + err.message);
  }
}

  }
  render();

function toggleSubtask(taskId, idx) {
  const t = state.tasks.find(x => x.id === taskId);
  if (t && t.subtasks[idx]) {
    t.subtasks[idx].done = !t.subtasks[idx].done;
    save();
  }
}
function changeStatus(taskId, s) {
  const t = state.tasks.find(x => x.id === taskId);
  if (t) { t.status = s; save(); }
}
function addSubtask(taskId) {
  const text = prompt('輸入 Sub-task 名稱：');
  if (!text) return;
  const aiTool = prompt('負責 AI 工具：', 'Gemini') || 'AI';
  const t = state.tasks.find(x => x.id === taskId);
  if (t) {
    t.subtasks.push({ text, aiTool, done: false });
    save();
  }
}

function renderTaskCard(t) {

        <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask('${t.id}',${i})" class="mt-0.5 rounded bg-slate-800 border-slate-700 text-indigo-500">
        <span>${s.text}</span>
      </label>
      <span class="text-[10px] mono px-1.5 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-500/20 whitespace-nowrap">${s.aiTool || 'AI'}</span>
    </div>
  `).join('');

  return `

      <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-800 text-indigo-300">${proj.name}</span>

          <option value="in-progress" ${t.status==='in-progress'?'selected':''}>⚡ In Progress</option>
          <option value="done" ${t.status==='done'?'selected':''}>✅ Done</option>

        <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1">

          <button onclick="addSubtask('${t.id}')" class="text-indigo-400 hover:text-indigo-300 cursor-pointer">+ 新增細項</button>
