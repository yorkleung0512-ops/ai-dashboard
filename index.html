<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>York's AI Projects & Toolchain Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background:#090d16; color:#f1f5f9; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-30 px-4 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white shadow">⚡</div>
        <div>
          <h1 class="font-bold text-base text-white">York's AI Projects & Toolchain Command Center</h1>
          <p class="text-xs text-slate-400">Single Source of Truth · 支援 GitHub API 自動同步</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="syncStatus" class="text-[11px] px-2.5 py-1 rounded bg-slate-800 text-slate-400 border border-slate-700">檢查中...</span>
        <button id="btnGhConfig" onclick="openGhModal()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium cursor-pointer transition">⚙️ GitHub 設定</button>
        <button onclick="pushToGitHub(true)" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium shadow cursor-pointer transition">💾 立即推送 GitHub</button>
      </div>
    </div>
  </header>

  <!-- GitHub Config Modal (改用 inline style 控制 display) -->
  <div id="ghModal" style="display: none;" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="text-sm font-bold text-white">⚙️ GitHub API 自動同步設定</h3>
        <button onclick="closeGhModal()" class="text-slate-400 hover:text-white text-lg font-bold p-1 cursor-pointer">✕</button>
      </div>
      <p class="text-xs text-slate-300 leading-relaxed">
        設定後，所有 Task 新增、狀態變更及勾選皆會自動透過 GitHub REST API commit 並 push 至 Repo，無需手動改檔。Token 僅存於你本機瀏覽器。
      </p>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Repo Owner (GitHub 帳號)</label>
          <input id="ghOwner" type="text" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-white mono" value="yorkleung0512-ops">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Repo Name</label>
          <input id="ghRepo" type="text" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-white mono" value="ai-dashboard">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Branch</label>
          <input id="ghBranch" type="text" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-white mono" value="main">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">GitHub Personal Access Token (PAT)</label>
          <input id="ghToken" type="password" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-white mono">
          <span class="text-[10px] text-slate-500">需包含 repo 或 contents:write 權限。</span>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
        <button onclick="closeGhModal()" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs cursor-pointer">取消</button>
        <button onclick="saveGhConfig()" class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold cursor-pointer">儲存設定</button>
      </div>
    </div>
  </div>

  <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
    <!-- 1. AI Projects & Toolchain Matrix -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-bold text-indigo-300 uppercase tracking-wider">🤖 Projects & Dedicated AI Toolchain</h2>
        <span class="text-xs text-slate-400">點擊專案可過濾任務</span>
      </div>
      <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </section>

    <!-- 2. 快速新增 Task -->
    <section class="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
      <div
