<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>York's AI Projects & Toolchain Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; transition: background-color 0.2s, color 0.2s; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    html.dark body { background: #070b12; color: #f1f5f9; }
    html.dark .panze-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
    html.dark .panze-card:hover { border-color: rgba(99, 102, 241, 0.6); }
    html.dark .panze-inner { background: rgba(2, 6, 23, 0.6); border-color: rgba(30, 41, 59, 0.8); }
    html:not(.dark) body { background: #f8fafc; color: #0f172a; }
    html:not(.dark) .panze-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); }
    html:not(.dark) .panze-card:hover { border-color: #6366f1; box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.1); }
    html:not(.dark) .panze-inner { background: #f1f5f9; border-color: #e2e8f0; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-slate-950/80 backdrop-blur sticky top-0 z-30 px-5 py-3.5 transition-colors">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-500/20">⚡</div>
        <div>
          <h1 class="font-bold text-sm tracking-wide text-slate-900 dark:text-white">PANZE STUDIO // AI COMMAND CENTER</h1>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">Single Source of Truth · Supabase agent_sync 對齊</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="syncStatus" class="text-[11px] px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800">檢查中...</span>
        <button id="btnThemeToggle" type="button" class="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-medium cursor-pointer transition flex items-center gap-1.5">
          <span id="themeIcon">🌙</span>
          <span id="themeText" class="hidden sm:inline">深色模式</span>
        </button>
        <button id="btnGhModal" type="button" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-medium cursor-pointer transition">⚙️ GitHub 設定</button>
        <button id="btnPush" type="button" class="text-xs px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium shadow-md shadow-indigo-600/25 cursor-pointer transition">💾 立即推送 GitHub</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto px-5 py-6 space-y-7 flex-1">
    <!-- SoT 狀態指示欄 -->
    <div class="bg-indigo-950/30 border border-indigo-500/30 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-indigo-200 font-medium">Canonical SoT: <span class="mono text-white">yorlio-staging</span> (agent_sync)</span>
      </div>
      <div class="flex items-center gap-3 text-slate-400 mono text-[11px]">
        <span>Workspace: <strong class="text-slate-200">yorlio</strong></span>
        <span>Project: <strong class="text-slate-200">main</strong></span>
        <span>Blockers: <strong class="text-emerald-400">0</strong></span>
        <span>Sync: <strong class="text-slate-200">2026-10-20</strong></span>
      </div>
    </div>

    <!-- Executive KPI -->
    <section id="kpiOverview" class="grid grid-cols-2 sm:grid-cols-4 gap-3.5"></section>

    <!-- 專案矩陣卡片 -->
    <section>
      <div class="flex items-center justify-between mb-3.5">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
          <h2 id="projectsHeader" class="text-xs font-bold text-slate-700 dark:text-slate-300 tracking-wider uppercase">Active Projects & Tech Matrix</h2>
        </div>
        <span class="text-xs text-slate-400">點擊卡片過濾專案</span>
      </div>
      <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- 快速建立任務列 -->
    <section class="panze-card rounded-xl p-4 shadow-sm">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5">
        <input id="newTitle" type="text" placeholder="+ 輸入新 Task 標題..." class="md:col-span-4 bg-slate-50 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-white focus:border-indigo-500 focus:outline-none">
        <select id="newProject" class="md:col-span-3 bg-slate-50 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-lg px-2.5 py-2 text-xs text-slate-800 dark:text-slate-200"></select>
        <input id="newAiTool" type="text" placeholder="🤖 負責 AI (如 Gemini / Claude)" class="md:col-span-3 bg-slate-50 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-2 text-xs text-indigo-600 dark:text-indigo-300">
        <button id="btnAddTask" type="button" class="md:col-span-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg px-3 py-2 text-xs cursor-pointer shadow">新增任務</button>
      </div>
    </section>

    <!-- 視角切換器 -->
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800/80 pb-3">
      <div class="flex items-center gap-2">
        <button id="tabFocus" type="button" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white cursor-pointer shadow-sm">🔥 任務清單 (Tasks)</button>
        <button id="tabKanban" type="button" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer">🎛️ 完整看板 (Kanban)</button>
      </div>
      <div class="flex items-center gap-2">
        <span id="filterLabel" class="text-xs text-slate-500 dark:text-slate-400">顯示全部 Projects</span>
        <button id="btnResetFilter" type="button" class="text-xs px-2.5 py-1 rounded bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 cursor-pointer">重設過濾</button>
      </div>
    </div>

    <!-- 任務內容區 -->
    <div id="viewContainer"></div>
  </main>

<script>
// 依據 agent_sync SoT 快照更新預設數據，嚴格杜絕未經證實的假任務
const DEFAULT_DATA = {
  projects: [
    {
      id: 'main',
      sotId: 'ebe1c8a4-ed61-475d-8960-b97e50ff0128',
      workspaceSlug: 'yorlio',
      name: '📈 Yorlio main',
      desc: 'Yorlio portfolio app + yorlio.com — migrate off Atoms to Path A self-host',
      status: 'active',
      health: 'green',
      currentPhase: 2,
      stack: {
        frontend: 'Path A Self-host / HTML5',
        backend: 'Cloudflare / Serverless',
        database: 'Supabase (foqgydlgzjsdwclsbimu)',
        hosting: 'Cloudflare / Self-host',
        ai: 'Claude MCP, Gemini'
      },
      tools: [
        { tool: 'Claude MCP', role: '持倉分析與架構遷移邏輯' },
        { tool: 'Gemini', role: '跨 Agent 狀態同步與文件驗證' }
      ]
    },
    {
      id: 'halo-kakak',
      name: '🏠 屋企家務通 (Halo Kakak!)',
      desc: '香港僱主與印傭雙語家務管理、廣東話轉地道印尼文、TTS 與跨機即時同步',
      status: 'active',
      health: 'green',
      currentPhase: 2,
      stack: {
        frontend: 'React + Tailwind CSS',
        backend: 'Supabase Realtime API',
        database: 'Supabase (household_sync)',
        hosting: 'Atoms.dev / Vercel',
        ai: 'Gemini Flash, Web Speech API'
      },
      tools: [
        { tool: 'Gemini API', role: '廣東話轉禮貌印尼文翻譯' },
        { tool: 'Supabase', role: 'Room Code 跨手機即時同步' }
      ]
    },
    {
      id: 'trading-bot',
      name: '🤖 智能交易訊號 Bot',
      desc: '自動化交易策略回測、Webhook 訊號接收與風險控管執行',
      status: 'active',
      health: 'green',
      currentPhase: 2,
      stack: {
        frontend: 'CLI / Webhook 服務',
        backend: 'Python FastAPI',
        database: 'SQLite / JSON Log',
        hosting: 'AWS / Local Server',
        ai: 'Grok / Cursor'
      },
      tools: [
        { tool: 'Grok / Cursor', role: '策略邏輯與 Python 腳本編寫' },
        { tool: 'CCXT', role: '交易所 API 對接' }
      ]
    }
  ],
  tasks: [] // SoT todos 為空，嚴格維持空陣列
};

let state = DEFAULT_DATA;
try {
  const local = localStorage.getItem('york_ai_dash_sot_v1');
  if (local) state = JSON.parse(local);
} catch (e) {
  state = DEFAULT_DATA;
}

let currentTab = 'focus';
let activeProject = 'ALL';

function save() {
  try {
    localStorage.setItem('york_ai_dash_sot_v1', JSON.stringify(state));
  } catch (e) {}
  render();
}

function filterProject(id) { activeProject = id; render(); }

function renderTaskCard(t) {
  const proj = state.projects.find(p => p.id === t.projectId) || { name: t.projectId };
  return `
    <div class="panze-card rounded-xl p-4 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-950/80 text-indigo-700 dark:text-indigo-300 border border-slate-200 dark:border-slate-800">${proj.name}</span>
        <span class="text-xs text-slate-400 font-mono">${t.status}</span>
      </div>
      <h4 class="font-bold text-sm text-slate-900 dark:text-white">${t.title}</h4>
      <div class="text-[11px] text-slate-400">負責 AI: <span class="mono text-indigo-400">${t.aiTool || 'AI'}</span></div>
    </div>
  `;
}

function render() {
  // KPI 橫幅
  const kpiEl = document.getElementById('kpiOverview');
  if (kpiEl) {
    kpiEl.innerHTML = `
      <div class="panze-card rounded-xl p-3.5 space-y-1">
        <span class="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">SoT Blockers</span>
        <div class="text-xl font-bold text-emerald-500">0 阻礙</div>
      </div>
      <div class="panze-card rounded-xl p-3.5 space-y-1">
        <span class="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">SoT 待辦任務</span>
        <div class="text-xl font-bold text-slate-900 dark:text-white">${state.tasks.length} 個</div>
      </div>
      <div class="panze-card rounded-xl p-3.5 space-y-1">
        <span class="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">已對齊專案</span>
        <div class="text-xl font-bold text-indigo-500">${state.projects.length} 個</div>
      </div>
      <div class="panze-card rounded-xl p-3.5 space-y-1">
        <span class="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">SoT 數據健康度</span>
        <div class="text-xl font-bold text-emerald-400">Green (正常)</div>
      </div>
    `;
  }

  // 專案卡片
  const pGrid = document.getElementById('projectGrid');
  if (pGrid) {
    pGrid.innerHTML = state.projects.map(p => {
      const isSelected = activeProject === p.id;
      const stack = p.stack || {};
      return `
        <div onclick="filterProject('${p.id}')" class="panze-card cursor-pointer rounded-xl p-4 transition relative flex flex-col justify-between ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/30' : ''}">
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="font-bold text-sm text-slate-900 dark:text-white">${p.name}</span>
              <span class="text-[9px] px-1.5 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-500/30">🟢 Active</span>
            </div>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">${p.desc}</p>
            <div class="bg-slate-900/60 rounded-lg p-2.5 border border-slate-800/80 space-y-1 text-[11px] mono">
              <div><span class="text-slate-400">Front:</span> <span class="text-slate-200">${stack.frontend}</span></div>
              <div><span class="text-slate-400">DB:</span> <span class="text-slate-200">${stack.database}</span></div>
              <div><span class="text-indigo-400">AI:</span> <span class="text-emerald-400">${stack.ai}</span></div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  const sel = document.getElementById('newProject');
  if (sel) {
    sel.innerHTML = state.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  }

  const container = document.getElementById('viewContainer');
  if (!container) return;

  const filtered = activeProject === 'ALL' ? state.tasks : state.tasks.filter(t => t.projectId === activeProject);
  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="panze-card rounded-xl p-8 text-center space-y-2">
        <div class="text-2xl">📋</div>
        <h3 class="font-bold text-sm text-slate-300">目前 agent_sync 無未結案待辦任務 (Todos is empty)</h3>
        <p class="text-xs text-slate-500">權威資料庫內目前為 0 Blockers、0 待辦事項。此儀表板已與 SoT 嚴格對齊，不包含任何模擬假任務。</p>
      </div>
    `;
  } else {
    container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${filtered.map(renderTaskCard).join('')}</div>`;
  }
}

window.addEventListener('load', () => {
  document.getElementById('btnThemeToggle').onclick = () => {
    document.documentElement.classList.toggle('dark');
  };
  document.getElementById('btnResetFilter').onclick = () => filterProject('ALL');
  document.getElementById('btnAddTask').onclick = () => {
    const title = document.getElementById('newTitle').value.trim();
    if (!title) return;
    const projectId = document.getElementById('newProject').value;
    const aiTool = document.getElementById('newAiTool').value.trim() || 'Gemini';
    state.tasks.unshift({
      id: 't_' + Date.now(),
      projectId,
      title,
      status: 'in-progress',
      aiTool
    });
    document.getElementById('newTitle').value = '';
    save();
  };
  render();
});
</script>
</body>
</html>
