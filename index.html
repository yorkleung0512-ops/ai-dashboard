<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>York's AI Projects & Toolchain Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; transition: background-color 0.2s, color 0.2s; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    html.dark body { background: #070b12; color: #f1f5f9; }
    html.dark .panze-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
    html.dark .panze-card:hover { border-color: rgba(99, 102, 241, 0.6); }
    html.dark .panze-inner { background: rgba(2, 6, 23, 0.6); border-color: rgba(30, 41, 59, 0.8); }

    html:not(.dark) body { background: #f8fafc; color: #0f172a; }
    html:not(.dark) .panze-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); }
    html:not(.dark) .panze-card:hover { border-color: #6366f1; box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.1); }
    html:not(.dark) .panze-inner { background: #f1f5f9; border-color: #e2e8f0; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-slate-950/80 backdrop-blur sticky top-0 z-30 px-5 py-3.5 transition-colors">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-500/20">⚡</div>
        <div>
          <h1 class="font-bold text-sm tracking-wide text-slate-900 dark:text-white">PANZE STUDIO // AI COMMAND CENTER</h1>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">Single Source of Truth · 專案連結 & 程式庫導航 · Supabase Realtime 共享中樞</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="syncStatus" class="text-[11px] px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800">檢查中...</span>
        <button id="btnThemeToggle" type="button" class="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-medium cursor-pointer transition flex items-center gap-1.5">
          <span id="themeIcon">🌙</span>
          <span id="themeText" class="hidden sm:inline">深色模式</span>
        </button>
        <button id="btnConfigModal" type="button" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-medium cursor-pointer transition">⚙️ 雲端設定 (Supabase & GitHub)</button>
        <button id="btnForceReset" type="button" class="text-xs px-2.5 py-1.5 rounded-lg bg-rose-950/30 hover:bg-rose-900/50 text-rose-300 border border-rose-800/40 font-medium cursor-pointer transition" title="當畫面異常時一鍵復原預設">🔄 重設快取</button>
      </div>
    </div>
  </header>

  <!-- 雲端與 Supabase 同步設定 Modal -->
  <div id="configModal" style="display: none;" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2">
        <h3 class="text-sm font-bold text-slate-900 dark:text-white">⚙️ 雲端即時同步中樞設定</h3>
        <button id="btnCloseConfig" type="button" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-base font-bold p-1">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div class="bg-indigo-50 dark:bg-indigo-950/30 p-2.5 rounded-lg border border-indigo-200 dark:border-indigo-500/20 text-indigo-800 dark:text-indigo-300">
          💡 <strong>Supabase 共享中樞</strong>：填入後啟動全球 WebSocket Realtime 即時雙向同步，任何終端修改均在 1 秒內更新。
        </div>
        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1">Supabase Project URL</label>
          <input id="sbUrl" type="text" placeholder="https://xxxx.supabase.co" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white mono">
        </div>
        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1">Supabase Anon Public Key</label>
          <input id="sbKey" type="password" placeholder="eyJhbGciOi..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white mono">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
        <button id="btnCancelConfig" type="button" class="px-3 py-1.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs">取消</button>
        <button id="btnSaveConfig" type="button" class="px-3.5 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold">儲存並連接 Supabase</button>
      </div>
    </div>
  </div>

  <!-- 新增專案 Modal -->
  <div id="addProjectModal" style="display: none;" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2">
        <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-1.5">🚀 新增專案 (Add Project Manually)</h3>
        <button id="btnCloseProjModal" type="button" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-base font-bold p-1">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">專案代號 (ID, 英文唯一值)</label>
            <input id="projNewId" type="text" placeholder="例如: my-ai-agent" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white mono">
          </div>
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">專案名稱 (含 Emoji)</label>
            <input id="projNewName" type="text" placeholder="例如: 🤖 AI 客服中樞" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white">
          </div>
        </div>
        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1">一句話定位與簡介</label>
          <input id="projNewDesc" type="text" placeholder="例如: 結合 Claude MCP 與 WhatsApp API 的自動化客服流程" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white">
        </div>
        
        <div class="grid grid-cols-3 gap-2.5 bg-slate-50 dark:bg-slate-950/60 p-2.5 rounded-lg border border-slate-200 dark:border-slate-800">
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">🌐 Production URL</label>
            <input id="projNewProdUrl" type="url" placeholder="https://..." class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded px-2.5 py-1.5 text-slate-900 dark:text-white mono text-[11px]">
          </div>
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">🧪 Testing URL</label>
            <input id="projNewTestUrl" type="url" placeholder="https://..." class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded px-2.5 py-1.5 text-slate-900 dark:text-white mono text-[11px]">
          </div>
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">🐙 GitHub Repo</label>
            <input id="projNewGithub" type="text" placeholder="user/repo" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded px-2.5 py-1.5 text-slate-900 dark:text-white mono text-[11px]">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">起始階段</label>
            <select id="projNewPhase" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white">
              <option value="1">Phase 1: 需求釐清</option>
              <option value="2" selected>Phase 2: MVP 原型</option>
              <option value="3">Phase 3: 實測反饋</option>
              <option value="4">Phase 4: 變現驗證</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">健康狀態</label>

              <option value="active" selected>🟡 Active (積極推進)</option>
              <option value="review">🔴 Review (需覆核/卡關)</option>
            </select>
          </div>
        </div>
        <div>

      </div>
      <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    </section>

    <!-- 快速建立任務列 -->
    <section class="panze-card rounded-xl p-4 shadow-sm">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5">
        <input id="newTitle" type="text" placeholder="+ 輸入新 Task 標題..." class="md:col-span-4 bg-slate-50 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-white focus:border-indigo-500 focus:outline-none">
        <select id="newProject" class="md:col-span-2 bg-slate-50 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-lg px-2.5 py-2 text-xs text-slate-800 dark:text-slate-200"></select>

        <button id="btnAddTask" type="button" class="md:col-span-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg px-3 py-2 text-xs cursor-pointer shadow">新增任務</button>
      </div>
    </section>

    <!-- 看板控制視角 (焦點 / 看板 / 路線圖) -->
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800/80 pb-3">
      <div class="flex items-center gap-2">
        <button id="tabFocus" type="button" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white cursor-pointer shadow-sm">🔥 焦點任務 (In Progress)</button>
        <button id="tabKanban" type="button" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer">🎛️ 完整看板 (Kanban)</button>
        <button id="tabRoadmap" type="button" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer">🚀 階段路線圖 (Roadmap)</button>
      </div>
      <div class="flex items-center gap-2">
        <span id="filterLabel" class="text-xs text-slate-500 dark:text-slate-400">顯示全部 Projects</span>
        <button id="btnResetFilter" type="button" class="text-xs px-2.5 py-1 rounded bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 cursor-pointer">重設過濾</button>
      </div>
    </div>

    <!-- 任務內容卡片區 -->
    <div id="viewContainer"></div>
  </main>

// 健壯資料清理函數：防止任何缺失或損壞欄位引發致命渲染中斷
function sanitizeState(data) {
  if (!data || typeof data !== 'object') return DEFAULT_DATA;
  const rawProjects = Array.isArray(data.projects) && data.projects.length > 0 ? data.projects : DEFAULT_DATA.projects;
  const rawTasks = Array.isArray(data.tasks) ? data.tasks : DEFAULT_DATA.tasks;

  const cleanProjects = rawProjects.map(p => {
    let prodUrl = p.prodUrl || '';
    let testUrl = p.testUrl || '';
    let githubRepo = p.githubRepo || '';
    if (p.id === 'halo-kakak') {
      if (!prodUrl) prodUrl = 'https://halo-kakak.pages.dev/';
      if (!testUrl) testUrl = 'https://halo-kakak.pages.dev/?mode=kakak';
      if (!githubRepo) githubRepo = 'yorkleung0512-ops/halo-kakak';
    }

    return {
      id: p.id || 'proj_' + Math.random().toString(36).substring(2, 7),
      name: p.name || '未命名專案',
      desc: p.desc || '',
      status: p.status || 'active',
      currentPhase: Number(p.currentPhase) || 2,
      prodUrl: prodUrl,
      testUrl: testUrl,
      githubRepo: githubRepo,
      tools: Array.isArray(p.tools) ? p.tools : [{ tool: 'AI Tool', role: '輔助開發' }]
    };
  });

  const cleanTasks = rawTasks.map(t => ({
    id: t.id || 't_' + Math.random().toString(36).substring(2, 7),
    projectId: t.projectId || (cleanProjects[0] ? cleanProjects[0].id : 'agent-sync'),
    phase: Number(t.phase) || 2,
    title: t.title || '待辦事項',
    status: t.status || 'todo',
    note: t.note || '',
    promptSnippet: t.promptSnippet || '',
    subtasks: Array.isArray(t.subtasks) ? t.subtasks : []
  }));

  return { projects: cleanProjects, tasks: cleanTasks };
}

function applyTheme(theme) {
  const html = document.documentElement;
  const icon = document.getElementById('themeIcon');
  const text = document.getElementById('themeText');
  if (theme === 'dark') {
    html.classList.add('dark');
    if (icon) icon.innerText = '🌙';
    if (text) text.innerText = '深色模式';
  } else {
    html.classList.remove('dark');

  }

  }

async function initSupabaseHub() {
  if (!syncConfig.sbUrl || !syncConfig.sbKey) {
    updateSyncUI('local');
    return;
  }
  try {
    supabaseClient = window.supabase.createClient(syncConfig.sbUrl, syncConfig.sbKey);
    
    const { data, error } = await supabaseClient
      .from('ai_dashboard_state')
      .select('payload')
      .eq('id', 'primary_dashboard')
      .single();

    if (!error && data && data.payload) {
      state = sanitizeState(data.payload);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    supabaseClient
      .channel('public:ai_dashboard_state')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ai_dashboard_state' }, (payload) => {
        if (payload.new && payload.new.payload) {
          state = sanitizeState(payload.new.payload);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          render();
          updateSyncUI('realtime');
        }
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          updateSyncUI('realtime');
        }
      });
  } catch (err) {
    console.error('Supabase Init Error:', err);
    updateSyncUI('error', 'Supabase 連線失敗');
  }
}

async function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  render();

  if (supabaseClient) {
    updateSyncUI('syncing');
    try {
      const { error } = await supabaseClient
        .from('ai_dashboard_state')
        .upsert({
          id: 'primary_dashboard',
          payload: state,
          updated_at: new Date().toISOString()
        });
      if (error) throw error;
      updateSyncUI('realtime');
    } catch (err) {
      console.error(err);
      updateSyncUI('error', 'Supabase 上傳失敗');
    }
  }
}

function toggleSubtask(taskId, idx) {
  const t = state.tasks.find(x => x.id === taskId);
  if (t && t.subtasks && t.subtasks[idx]) {
    t.subtasks[idx].done = !t.subtasks[idx].done;
    save();
  }
}
function changeStatus(taskId, s) {
  const t = state.tasks.find(x => x.id === taskId);
  if (t) { t.status = s; save(); }
}
function changePhase(taskId, p) {
  const t = state.tasks.find(x => x.id === taskId);
  if (t) { t.phase = parseInt(p); save(); }
}

function addSubtask(taskId) {
  const text = prompt('輸入 Sub-task 名稱：');
  if (!text) return;
  const aiTool = prompt('負責 AI 工具：', 'Supabase Realtime') || 'AI';
  const t = state.tasks.find(x => x.id === taskId);
  if (t) {
    if (!Array.isArray(t.subtasks)) t.subtasks = [];
    t.subtasks.push({ text, aiTool, done: false });
    save();
  }
}

function getProjectProgress(projId) {
  const pTasks = (state.tasks || []).filter(t => t.projectId === projId);
  let total = 0, done = 0;
  pTasks.forEach(t => {
    (t.subtasks || []).forEach(s => {
      total++;
      if (s.done) done++;
    });
  });
  return total === 0 ? 0 : Math.round((done / total) * 100);
}

        }

        return `
          <div class="panze-card cursor-pointer rounded-xl p-4 transition relative flex flex-col justify-between ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/30 bg-indigo-50/50 dark:bg-indigo-950/20' : ''}">
            <div class="space-y-2.5" onclick="filterProject('${p.id}')">
              <div class="flex items-center justify-between gap-1">
                <span class="font-bold text-sm text-slate-900 dark:text-white truncate">${p.name}</span>
                ${badgeHtml}
              </div>

              ${links.length > 0 ? `
                <div class="flex flex-wrap items-center gap-1.5 pt-0.5">
                  ${links.join('')}
                </div>
              ` : ''}

              <div class="space-y-1">
                <div class="flex items-center justify-between text-[10px] text-slate-500 dark:text-slate-400 font-medium">
                  <span>目前階段</span>
                  <span class="text-indigo-600 dark:text-indigo-400 font-bold">${PHASE_NAMES[curPhase] || 'Phase 2: MVP 原型'}</span>
                </div>
                <div class="grid grid-cols-4 gap-1">
                  ${[1, 2, 3, 4].map(idx => `
                    <div class="h-1.5 rounded-full ${idx <= curPhase ? 'bg-indigo-500' : 'bg-slate-200 dark:bg-slate-800'} transition-colors"></div>
                  `).join('')}
                </div>
              </div>
              <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">${p.desc || ''}</p>
            </div>

            <div class="space-y-1.5 pt-3 mt-3 border-t border-slate-100 dark:border-slate-800/80">
              <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">專用 AI 工具鏈 (點擊過濾)：</div>
              <div class="flex flex-wrap gap-1">
                ${(p.tools || []).map(tl => `
                  <button type="button" onclick="event.stopPropagation(); filterAiTool('${tl.tool}')" class="text-[10px] mono px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hover:border-indigo-500 text-slate-700 dark:text-slate-300 transition" title="點擊過濾此 AI 工具任務">
                    <span class="text-emerald-600 dark:text-emerald-400">${tl.tool}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    const sel = document.getElementById('newProject');
    if (sel) {
      sel.innerHTML = (state.projects || []).map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    const fLabel = document.getElementById('filterLabel');
    if (fLabel) {
      let labelText = `顯示全部 Projects (${(state.projects || []).length})`;
      if (activeProject !== 'ALL') {
        const proj = (state.projects || []).find(p => p.id === activeProject);
        labelText = `已過濾專案: ${proj ? proj.name : activeProject}`;
      }
      if (activeAiToolFilter !== 'ALL') {
        labelText += ` · AI 工具: ${activeAiToolFilter}`;
      }
      fLabel.innerText = labelText;
    }

    let filtered = state.tasks || [];
    if (activeProject !== 'ALL') {
      filtered = filtered.filter(t => t.projectId === activeProject);
    }
    if (activeAiToolFilter !== 'ALL') {
      filtered = filtered.filter(t => (t.subtasks || []).some(s => (s.aiTool || '').includes(activeAiToolFilter)));
    }

    const container = document.getElementById('viewContainer');
    if (!container) return;

    if (currentTab === 'focus') {
      const focusTasks = filtered.filter(t => t.status !== 'done');
      container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${focusTasks.map(renderTaskCard).join('')}</div>`;
    } else if (currentTab === 'kanban') {
      const cols = [{ key: 'todo', label: '📋 To Do' }, { key: 'in-progress', label: '⚡ In Progress' }, { key: 'done', label: '✅ Done' }];
      container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">${cols.map(c => `
        <div class="panze-card rounded-xl p-3.5 space-y-3">
          <div class="font-bold text-xs text-slate-700 dark:text-slate-300 px-1 flex items-center justify-between">
            <span>${c.label}</span>
            <span class="text-[10px] mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-950 text-slate-500 dark:text-slate-400">${filtered.filter(t => t.status === c.key).length}</span>
          </div>
          <div class="space-y-3">${filtered.filter(t => t.status === c.key).map(renderTaskCard).join('')}</div>
        </div>
      `).join('')}</div>`;
    } else if (currentTab === 'roadmap') {
      const phases = [
        { id: 1, name: 'Phase 1: 需求釐清 & 規格定義', desc: '釐清核心用戶價值主張與資料模型' },
        { id: 2, name: 'Phase 2: MVP 原型建置', desc: '使用 AI 工具快速完成可走通之 Demo' },
        { id: 3, name: 'Phase 3: 實測反饋 & 優化', desc: '收集反饋、修復登入與資料計算盲點' },
        { id: 4, name: 'Phase 4: 變現機制驗證', desc: '上線付費方案、流量獲客與跨通路轉化' }
      ];

      container.innerHTML = `
        <div class="space-y-6">
          ${phases.map(ph => {
            const phTasks = filtered.filter(t => (t.phase || 2) === ph.id);
            return `
              <div class="panze-card rounded-xl p-4 space-y-3 border-l-4 ${ph.id === 2 ? 'border-l-indigo-500' : 'border-l-slate-400'}">
                <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 dark:border-slate-800/80 pb-2">
                  <div>
                    <h3 class="font-bold text-sm text-slate-900 dark:text-white">${ph.name}</h3>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400">${ph.desc}</p>
                  </div>
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300">
                    ${phTasks.length} 個任務
                  </span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                  ${phTasks.length > 0 ? phTasks.map(renderTaskCard).join('') : '<div class="text-xs text-slate-400 italic py-2 col-span-full">此階段目前尚無任務</div>'}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }
  } catch (err) {
    console.error("Render loop caught error:", err);
  }
}

window.addEventListener('load', () => {
  initTheme();
  document.getElementById('btnThemeToggle').onclick = toggleTheme;

  document.getElementById('btnConfigModal').onclick = openConfigModal;
  document.getElementById('btnCloseConfig').onclick = closeConfigModal;
  document.getElementById('btnCancelConfig').onclick = closeConfigModal;

  document.getElementById('btnSaveConfig').onclick = () => {
    syncConfig.sbUrl = document.getElementById('sbUrl').value.trim();
    syncConfig.sbKey = document.getElementById('sbKey').value.trim();
    localStorage.setItem('york_cloud_config_v1', JSON.stringify(syncConfig));
    closeConfigModal();
    initSupabaseHub();
  };

  // 一鍵強制重設按鈕（保證任何時候均可恢復原貌）
  document.getElementById('btnForceReset').onclick = () => {
    if (confirm('確定要清除本機快取並復原預設專案資料嗎？')) {
      localStorage.removeItem(STORAGE_KEY);
      state = DEFAULT_DATA;
      save();
      location.reload();
    }
  };

  document.getElementById('btnOpenAddProject').onclick = openAddProjectModal;
  document.getElementById('btnCloseProjModal').onclick = closeAddProjectModal;
  document.getElementById('btnCancelProjModal').onclick = closeAddProjectModal;

  document.getElementById('btnSaveNewProject').onclick = () => {
    const id = document.getElementById('projNewId').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
    const name = document.getElementById('projNewName').value.trim();
    const desc = document.getElementById('projNewDesc').value.trim();
    const prodUrl = document.getElementById('projNewProdUrl').value.trim();
    const testUrl = document.getElementById('projNewTestUrl').value.trim();
    const githubRepo = document.getElementById('projNewGithub').value.trim();
    const currentPhase = parseInt(document.getElementById('projNewPhase').value) || 2;
    const status = document.getElementById('projNewStatus').value || 'active';
    const rawTools = document.getElementById('projNewTools').value.trim();

    if (!id || !name) {
      alert('請填寫專案代號 (ID) 與專案名稱！');
      return;
    }
    if ((state.projects || []).some(p => p.id === id)) {
      alert(`專案代號 "${id}" 已經存在！`);
      return;
    }

    const tools = [];
    if (rawTools) {
      rawTools.split('\n').forEach(line => {
        const parts = line.split(/[:：]/);
        if (parts.length >= 2) {
          tools.push({ tool: parts[0].trim(), role: parts.slice(1).join(':').trim() });
        } else if (line.trim()) {
          tools.push({ tool: line.trim(), role: '專屬開發輔助' });
        }
      });
    }

    state.projects.push({
      id,
      name,
      desc: desc || '自主開發專案',
      currentPhase,
      status,
      prodUrl,
      testUrl,
      githubRepo,
      tools: tools.length > 0 ? tools : [{ tool: 'Grok Build', role: '全端開發輔助' }]
    });

    closeAddProjectModal();
    save();
  };

  document.getElementById('btnAddTask').onclick = () => {
    const title = document.getElementById('newTitle').value.trim();
    if (!title) return;
    const projectId = document.getElementById('newProject').value;
    const phase = parseInt(document.getElementById('newPhase').value) || 2;
    const aiTool = document.getElementById('newAiTool').value.trim() || 'Supabase Realtime';
    state.tasks.unshift({
      id: 't_' + Date.now(),
      projectId,
      phase,
      title,
      status: 'in-progress',
      note: '',
      subtasks: [{ text: '落實執行方針', aiTool, done: false }]
    });
    document.getElementById('newTitle').value = '';
    document.getElementById('newAiTool').value = '';
    save();
  };

  document.getElementById('tabFocus').onclick = () => setTab('focus');
  document.getElementById('tabKanban').onclick = () => setTab('kanban');
  document.getElementById('tabRoadmap').onclick = () => setTab('roadmap');
  document.getElementById('btnResetFilter').onclick = resetAllFilters;

  render();
  initSupabaseHub();
});
</script>
</body>
</html>
