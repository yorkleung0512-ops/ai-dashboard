let state = DEFAULT_DATA;
try {
  const local = localStorage.getItem('york_ai_dash_v15');
  if (local) state = JSON.parse(local);
} catch (e) {
  state = DEFAULT_DATA;
}

let ghConfig = {
  owner: 'yorkleung0512-ops',
  repo: 'ai-dashboard',
  branch: 'main',
  token: ''
};
try {
  const localGh = localStorage.getItem('york_gh_config_v2');
  if (localGh) ghConfig = JSON.parse(localGh);
} catch (e) {}

function save() {
  localStorage.setItem('york_ai_dash_v15', JSON.stringify(state));
  render();
  if (ghConfig.token) {
    pushToGitHub(false);
  }
}

function updateSyncUI(status, msg) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (status === 'synced') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-500/30';
    el.innerText = '✅ GitHub 已同步';
  } else if (status === 'syncing') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-indigo-950/80 text-indigo-300 border border-indigo-500/30 animate-pulse';
    el.innerText = '🔄 推送中...';
  } else if (status === 'error') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-rose-950/80 text-rose-300 border border-rose-500/30';
    el.innerText = '⚠️ 同步失敗: ' + (msg || '');
  } else {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-slate-900 text-slate-400 border border-slate-800';
    el.innerText = ghConfig.token ? '⚡ 已配置 Token' : '⚠️ 未配置 Token (僅本機)';
  }
}

async function pushToGitHub(showAlert = false) {
  if (!ghConfig.token) {
    if (showAlert) openModal();
    return;
  }
  updateSyncUI('syncing');

  try {
    const timestamp = Date.now();
    const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/index.html?ref=${ghConfig.branch}&_t=${timestamp}`;
    const headers = {
      'Authorization': `Bearer ${ghConfig.token}`,
      'Accept': 'application/vnd.github.v3+json'
    };

    const getRes = await fetch(url, { headers, cache: 'no-store' });
    let currentSha = null;
    let remoteContent = '';

    if (getRes.ok) {
      const data = await getRes.json();
      currentSha = data.sha;
      remoteContent = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
    } else if (getRes.status !== 404) {
      throw new Error(`無法連接 Repo (Status: ${getRes.status})`);
    }

    let baseHtml = remoteContent || document.documentElement.outerHTML;
    const stateMarkerRegex = /(const DEFAULT_DATA = )\{[\s\S]*?\n\};/;
    if (stateMarkerRegex.test(baseHtml)) {
      baseHtml = baseHtml.replace(stateMarkerRegex, `$1${JSON.stringify(state, null, 2)};`);
    }

    const utf8Bytes = new TextEncoder().encode(baseHtml);
    let binary = '';
    utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const base64Content = btoa(binary);

    const putUrl = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/index.html`;
    const body = {
      message: 'Dashboard Auto-sync: ' + new Date().toLocaleString(),
      content: base64Content,
      branch: ghConfig.branch
    };
    if (currentSha) body.sha = currentSha;

    const putRes = await fetch(putUrl, {
      method: 'PUT',
      headers,
      body: JSON.stringify(body)
    });

    if (!putRes.ok) {
      const err = await putRes.json();
      throw new Error(err.message || '寫入失敗');
    }

    updateSyncUI('synced');
    if (showAlert) alert('已成功推送至 GitHub！');
  } catch (err) {
    updateSyncUI('error', err.message);
    if (showAlert) alert('同步失敗: ' + err.message);
  }
}

  }
  render();
}

function toggleSubtask(taskId, idx) {
  const t = state.tasks.find(x => x.id === taskId);
  if (t && t.subtasks[idx]) {
    t.subtasks[idx].done = !t.subtasks[idx].done;
    save();
  }
}
function changeStatus(taskId, s) {
  const t = state.tasks.find(x => x.id === taskId);
  if (t) { t.status = s; save(); }
}
function addSubtask(taskId) {
  const text = prompt('輸入 Sub-task 名稱：');
  if (!text) return;
  const aiTool = prompt('負責 AI 工具：', 'Gemini') || 'AI';
  const t = state.tasks.find(x => x.id === taskId);
  if (t) {
    t.subtasks.push({ text, aiTool, done: false });
    save();
  }
}

// 計算單一專案進度百分比
function getProjectProgress(projId) {
  const pTasks = state.tasks.filter(t => t.projectId === projId);
  let total = 0, done = 0;
  pTasks.forEach(t => {
    (t.subtasks || []).forEach(s => {
      total++;
      if (s.done) done++;
    });
  });
  return total === 0 ? 0 : Math.round((done / total) * 100);
}

function renderTaskCard(t) {

        <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask('${t.id}', ${i})" class="mt-0.5 rounded bg-slate-950 border-slate-700 text-indigo-500 focus:ring-0">
        <span>${s.text}</span>
      </label>
      <span class="text-[10px] mono px-1.5 py-0.5 rounded bg-slate-900 text-indigo-300 border border-slate-800 whitespace-nowrap">${s.aiTool || 'AI'}</span>

  `).join('');

        <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-950/80 text-indigo-300 border border-slate-800">${proj.name}</span>
        <select onchange="changeStatus('${t.id}', this.value)" class="bg-slate-950 border border-slate-800 text-[11px] rounded px-2 py-0.5 text-slate-300">

          <option value="in-progress" ${t.status==='in-progress'?'selected':''}>⚡ In Progress</option>
          <option value="done" ${t.status==='done'?'selected':''}>✅ Done</option>
        </select>
      </div>
      <h4 class="font-bold text-sm text-white leading-snug">${t.title}</h4>
      ${t.note ? `<div class="text-[11px] text-amber-300/90 bg-amber-950/20 border border-amber-500/20 rounded px-2.5 py-1">📌 ${t.note}</div>` : ''}
      <div class="space-y-1.5 pt-1 border-t border-slate-800/80">
        <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1">
          <span class="font-medium text-slate-300">AI Sub-tasks</span>
          <button onclick="addSubtask('${t.id}')" class="text-indigo-400 hover:text-indigo-300 cursor-pointer">+ 新增細項</button>

        <div class="bg-slate-950/60 rounded-lg p-2.5 border border-slate-800/60 space-y-0.5">${subHtml}</div>
      </div>
    </div>
  `;
}

          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-bold text-sm text-white">${p.name}</span>
              <span class="text-[11px] mono font-semibold text-indigo-400">${pct}%</span>
            </div>
            <!-- 進度條 -->
            <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden border border-slate-800">
              <div class="bg-gradient-to-r from-indigo-500 to-violet-500 h-full rounded-full transition-all duration-300" style="width: ${pct}%"></div>
            </div>
            <p class="text-[11px] text-slate-400 leading-relaxed">${p.desc}</p>
          </div>

          <div class="space-y-1.5 pt-3 mt-3 border-t border-slate-800/80">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">專用 AI 工具鏈：</div>
            <div class="flex flex-wrap gap-1">
              ${p.tools.map(tl => `
                <span class="text-[10px] mono px-2 py-0.5 rounded bg-slate-950 border border-slate-800 text-slate-300" title="${tl.role}">
                  <span class="text-emerald-400">${tl.tool}</span>
                </span>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  const sel = document.getElementById('newProject');
  if (sel && sel.options.length !== state.projects.length) {
    sel.innerHTML = state.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  }

  const fLabel = document.getElementById('filterLabel');
  if (fLabel) fLabel.innerText = activeProject === 'ALL' ? '顯示全部 Projects' : '已過濾專案';

  const filtered = state.tasks.filter(t => activeProject === 'ALL' || t.projectId === activeProject);
  const container = document.getElementById('viewContainer');
  if (!container) return;

  if (currentTab === 'focus') {
    const focusTasks = filtered.filter(t => t.status !== 'done');
    container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${focusTasks.map(renderTaskCard).join('')}</div>`;
  } else {
    const cols = [{ key: 'todo', label: '📋 To Do' }, { key: 'in-progress', label: '⚡ In Progress' }, { key: 'done', label: '✅ Done' }];
    container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">${cols.map(c => `
      <div class="panze-card rounded-xl p-3.5 space-y-3">
        <div class="font-bold text-xs text-slate-300 px-1 flex items-center justify-between">
          <span>${c.label}</span>
          <span class="text-[10px] mono px-1.5 py-0.5 rounded bg-slate-950 text-slate-400">${filtered.filter(t => t.status === c.key).length}</span>
        </div>
        <div class="space-y-3">${filtered.filter(t => t.status === c.key).map(renderTaskCard).join('')}</div>
      </div>
    `).join('')}</div>`;
  }
}

// 頁面加載完成後綁定事件
window.addEventListener('load', () => {
  document.getElementById('btnGhModal').onclick = openModal;
  document.getElementById('btnCloseModal').onclick = closeModal;
  document.getElementById('btnCancelModal').onclick = closeModal;

  document.getElementById('btnSaveConfig').onclick = () => {
    ghConfig.owner = document.getElementById('ghOwner').value.trim();
    ghConfig.repo = document.getElementById('ghRepo').value.trim();
    ghConfig.branch = document.getElementById('ghBranch').value.trim();
    ghConfig.token = document.getElementById('ghToken').value.trim();
    localStorage.setItem('york_gh_config_v2', JSON.stringify(ghConfig));
    closeModal();
    updateSyncUI();
    if (ghConfig.token) pushToGitHub(true);
  };

  document.getElementById('btnPush').onclick = () => pushToGitHub(true);

  document.getElementById('btnAddTask').onclick = () => {
    const title = document.getElementById('newTitle').value.trim();
    if (!title) return;
    const projectId = document.getElementById('newProject').value;
    const aiTool = document.getElementById('newAiTool').value.trim() || 'Gemini';
    const aiRole = document.getElementById('newAiRole').value.trim() || '輔助開發';
    state.tasks.unshift({
      id: 't_' + Date.now(),
      projectId,
      title,
      status: 'in-progress',
      note: '',
      subtasks: [{ text: '落實執行方針', aiTool, done: false }]
    });
    document.getElementById('newTitle').value = '';
    document.getElementById('newAiTool').value = '';
    document.getElementById('newAiRole').value = '';
    save();
  };

  document.getElementById('tabFocus').onclick = () => setTab('focus');
  document.getElementById('tabKanban').onclick = () => setTab('kanban');
  document.getElementById('btnResetFilter').onclick = () => filterProject('ALL');

  render();
  updateSyncUI();
});
</script>
</body>
</html>
