const STORAGE_KEY = 'york_ai_dash_sot_v7';
let state = DEFAULT_DATA;
try {
  const local = localStorage.getItem(STORAGE_KEY);
  if (local) {
    const parsed = JSON.parse(local);
    // Prefer embedded SoT if newer export
    if (!parsed.sotMeta || !DEFAULT_DATA.sotMeta || parsed.sotMeta.exportedAt < DEFAULT_DATA.sotMeta.exportedAt) {
      state = DEFAULT_DATA;
      localStorage.removeItem(STORAGE_KEY);
    } else {
      state = parsed;
    }
  }
} catch (e) { state = DEFAULT_DATA; }

let currentTab = 'focus';
let activeProject = 'ALL';
let ghConfig = { owner: 'yorkleung0512-ops', repo: 'ai-dashboard', branch: 'main', token: '' };
try {
  const localGh = localStorage.getItem('york_gh_config_v2');
  if (localGh) ghConfig = JSON.parse(localGh);
} catch (e) {}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  render();
  if (ghConfig.token) pushToGitHub(false);
}

function updateSyncUI(status, msg) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (status === 'synced') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-500/30';
    el.innerText = '✅ GitHub 已同步';
  } else if (status === 'syncing') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-indigo-100 dark:bg-indigo-950/80 text-indigo-800 dark:text-indigo-300 border border-indigo-300 dark:border-indigo-500/30 animate-pulse';
    el.innerText = '🔄 推送中...';
  } else if (status === 'error') {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-rose-100 dark:bg-rose-950/80 text-rose-800 dark:text-rose-300 border border-rose-300 dark:border-rose-500/30';
    el.innerText = '⚠️ 同步失敗: ' + (msg || '');
  } else {
    el.className = 'text-[11px] px-2.5 py-1 rounded bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800';
    el.innerText = ghConfig.token ? '⚡ 已配置 Token' : '📦 已嵌入 SoT';
  }
}

async function pushToGitHub(showAlert = false) {
  if (!ghConfig.token) { if (showAlert) openModal(); return; }
  updateSyncUI('syncing');
  try {
    const timestamp = Date.now();
    const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/index.html?ref=${ghConfig.branch}&_t=${timestamp}`;
    const headers = { 'Authorization': `Bearer ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json' };
    const getRes = await fetch(url, { headers, cache: 'no-store' });
    let currentSha = null, remoteContent = '';
    if (getRes.ok) {
      const data = await getRes.json();
      currentSha = data.sha;
      remoteContent = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
    } else if (getRes.status !== 404) throw new Error(`無法連接 Repo (Status: ${getRes.status})`);
    let baseHtml = remoteContent || document.documentElement.outerHTML;
    const stateMarkerRegex = /(const DEFAULT_DATA = )\{[\s\S]*?\n\};/;
    if (stateMarkerRegex.test(baseHtml)) baseHtml = baseHtml.replace(stateMarkerRegex, `$1${JSON.stringify(state, null, 2)};`);
    const utf8Bytes = new TextEncoder().encode(baseHtml);
    let binary = ''; utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const body = { message: 'Dashboard SoT sync: ' + new Date().toISOString(), content: btoa(binary), branch: ghConfig.branch };
    if (currentSha) body.sha = currentSha;
    const putRes = await fetch(`https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/index.html`, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (!putRes.ok) { const err = await putRes.json(); throw new Error(err.message || '寫入失敗'); }
    updateSyncUI('synced');
    if (showAlert) alert('已成功推送至 GitHub！');
  } catch (err) {
    updateSyncUI('error', err.message);
    if (showAlert) alert('同步失敗: ' + err.message);
  }
}

function openModal() {
  const modal = document.getElementById('ghModal');
  if (!modal) return;
  document.getElementById('ghOwner').value = ghConfig.owner || 'yorkleung0512-ops';
  document.getElementById('ghRepo').value = ghConfig.repo || 'ai-dashboard';
  document.getElementById('ghBranch').value = ghConfig.branch || 'main';
  document.getElementById('ghToken').value = ghConfig.token || '';
  modal.style.display = 'flex';
}
function closeModal() { const m = document.getElementById('ghModal'); if (m) m.style.display = 'none'; }
function filterProject(id) { activeProject = id; render(); }

function setTab(tab) {
  currentTab = tab;
  const map = { focus: 'tabFocus', kanban: 'tabKanban', decisions: 'tabDecisions', links: 'tabLinks' };
  Object.entries(map).forEach(([k, id]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = (tab === k)
      ? 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white cursor-pointer shadow-sm'
      : 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 cursor-pointer';
  });
  render();
}

function statusBadge(status) {
  const label = labelStatus(status);
  if (status === 'active' || status === 'shipping') return '<span class="text-[9px] px-1.5 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-500/30" title="' + status + '">🟢 ' + label + '</span>';
  if (status === 'blocked') return '<span class="text-[9px] px-1.5 py-0.5 rounded font-bold bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300 border border-rose-500/30" title="blocked">🔴 受阻</span>';
  if (status === 'archived' || status === 'done') return '<span class="text-[9px] px-1.5 py-0.5 rounded font-bold bg-slate-100 text-slate-600 dark:bg-slate-900 dark:text-slate-400 border border-slate-500/30" title="' + status + '">⬛ ' + label + '</span>';
  return '<span class="text-[9px] px-1.5 py-0.5 rounded font-bold bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border border-amber-500/30" title="' + status + '">🟡 ' + label + '</span>';
}

function healthDot(h) {
  if (h === 'green' || h === 'healthy') return '🟢';
  if (h === 'yellow' || h === 'degraded') return '🟡';
  if (h === 'red' || h === 'down') return '🔴';
  return '⚪';
}

function labelStatus(status) {
  const map = {
    active: '進行中', shipping: '交付中', blocked: '受阻', archived: '已封存',
    done: '完成', todo: '待辦', 'in-progress': '進行中', open: '未開始',
    in_progress: '進行中', paused: '暫停', planned: '計劃中', accepted: '已採納',
    superseded: '已取代', rejected: '已否決', proposed: '提議中'
  };
  return map[status] || status || '—';
}

function labelHealth(h) {
  const map = {
    green: '良好', healthy: '健康', yellow: '注意', degraded: '降級',
    red: '異常', down: '停機', unknown: '未知'
  };
  return map[h] || h || '—';
}

function labelPriority(p) {
  const map = { critical: '緊急', high: '高', medium: '中', low: '低' };
  return map[p] || p || '—';
}

function labelLinkType(t) {
  const map = {
    dashboard: '儀表板', deploy: '部署', github: 'GitHub', docs: '文件',
    staging: 'Staging', production: 'Production', other: '其他'
  };
  return map[t] || t || '—';
}


function renderTaskCard(t) {
  const proj = state.projects.find(p => p.id === t.projectId) || { name: t.projectId };
  const blocker = t.isBlocker && t.status !== 'done'
    ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/40 font-bold">阻礙</span>'
    : '';
  const reason = t.blockedReason ? `<div class="text-[11px] text-amber-400/90">⛔ ${t.blockedReason}</div>` : '';
  return `
    <div class="panze-card rounded-xl p-4 space-y-3 ${t.isBlocker && t.status !== 'done' ? 'ring-1 ring-rose-500/40' : ''}">
      <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-950/80 text-indigo-700 dark:text-indigo-300 border border-slate-200 dark:border-slate-800">${proj.name}</span>
        <div class="flex items-center gap-1.5">${blocker}<span class="text-xs text-slate-400" title="${t.status}">${labelStatus(t.status)}</span></div>
      </div>
      <h4 class="font-bold text-sm text-slate-900 dark:text-white">${t.title}</h4>
      ${t.body ? `<p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed line-clamp-3">${t.body}</p>` : ''}
      ${reason}
      <div class="text-[11px] text-slate-400">負責: <span class="mono text-indigo-400">${t.aiTool || 'AI'}</span></div>
    </div>`;
}

function render() {
  const meta = state.sotMeta || {};
  const blockers = (state.tasks || []).filter(t => t.isBlocker && t.status !== 'done').length;
  const openTasks = (state.tasks || []).filter(t => ['todo','in-progress','blocked'].includes(t.status)).length;
  const healthLabel = blockers ? `注意（${blockers} 個阻礙）` : '良好';

  const banner = document.getElementById('sotBanner');
  if (banner) {
    banner.innerHTML = `
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full ${blockers ? 'bg-amber-400' : 'bg-emerald-400'} animate-pulse"></span>
        <span class="text-indigo-200 font-medium">權威 SoT：<span class="mono text-white">yorlio-staging / agent_sync</span></span>
      </div>
      <div class="flex flex-wrap items-center gap-3 text-slate-400 mono text-[11px]">
        <span>工作區 <strong class="text-slate-200">${meta.workspaceCount || 0}</strong></span>
        <span>專案 <strong class="text-indigo-300">${meta.projectCount || state.projects.length}</strong></span>
        <span>未完成 <strong class="text-slate-200">${openTasks}</strong></span>
        <span>阻礙 <strong class="${blockers ? 'text-amber-300' : 'text-emerald-400'}">${blockers}</strong></span>
        <span>決策 <strong class="text-slate-200">${(state.decisions||[]).length}</strong></span>
        <span class="text-slate-500">匯出 ${meta.exportedAt || ''}</span>
      </div>`;
  }

  const kpiEl = document.getElementById('kpiOverview');
  if (kpiEl) {
    kpiEl.innerHTML = `
      <div class="panze-card rounded-xl p-3.5 space-y-1"><span class="text-[10px] text-slate-500 font-bold tracking-wider">SoT 阻礙</span><div class="text-xl font-bold ${blockers ? 'text-amber-400' : 'text-emerald-500'}">${blockers} 個</div></div>
      <div class="panze-card rounded-xl p-3.5 space-y-1"><span class="text-[10px] text-slate-500 font-bold tracking-wider">進行中／未完成</span><div class="text-xl font-bold text-slate-900 dark:text-white">${openTasks} 個</div></div>
      <div class="panze-card rounded-xl p-3.5 space-y-1"><span class="text-[10px] text-slate-500 font-bold tracking-wider">SoT 專案</span><div class="text-xl font-bold text-indigo-500">${state.projects.length} 個</div></div>
      <div class="panze-card rounded-xl p-3.5 space-y-1"><span class="text-[10px] text-slate-500 font-bold tracking-wider">整體健康</span><div class="text-xl font-bold ${blockers ? 'text-amber-400' : 'text-emerald-400'}">${healthLabel}</div></div>`;
  }

  const hdr = document.getElementById('projectsHeader');
  if (hdr) hdr.innerText = `SoT 專案（${state.projects.length}）`;

  const pGrid = document.getElementById('projectGrid');
  if (pGrid) {
    pGrid.innerHTML = state.projects.map(p => {
      const isSelected = activeProject === p.id;
      const stack = p.stack || {};
      return `
        <div onclick="filterProject('${p.id}')" class="panze-card cursor-pointer rounded-xl p-4 transition relative flex flex-col justify-between ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/30' : ''}">
          <div class="space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <span class="font-bold text-sm text-slate-900 dark:text-white">${p.name}</span>
              ${statusBadge(p.status)}
            </div>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">${p.desc}</p>
            ${p.latestSummary ? `<p class="text-[11px] text-slate-400 italic">最新: ${p.latestSummary}</p>` : ''}
            <div class="bg-slate-900/60 rounded-lg p-2.5 border border-slate-800/80 space-y-1 text-[11px] mono">
              <div><span class="text-slate-400">工作區：</span> <span class="text-slate-200">${p.workspace || '-'}</span> · 健康 ${healthDot(p.health)} ${labelHealth(p.health)}</div>
              <div><span class="text-slate-400">前端：</span> <span class="text-slate-200">${stack.frontend || '-'}</span></div>
              <div><span class="text-slate-400">資料庫：</span> <span class="text-slate-200">${stack.database || '-'}</span></div>
              <div><span class="text-indigo-400">AI：</span> <span class="text-emerald-400 font-semibold">${stack.ai || '-'}</span></div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  const sel = document.getElementById('newProject');
  if (sel) sel.innerHTML = state.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  const fLabel = document.getElementById('filterLabel');
  if (fLabel) fLabel.innerText = activeProject === 'ALL' ? `顯示全部專案（${state.projects.length}）` : `已過濾：${activeProject}`;

  const container = document.getElementById('viewContainer');
  if (!container) return;
  const filtered = activeProject === 'ALL' ? state.tasks : state.tasks.filter(t => t.projectId === activeProject);

  if (currentTab === 'focus') {
    container.innerHTML = filtered.length
      ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${filtered.map(renderTaskCard).join('')}</div>`
      : `<div class="panze-card rounded-xl p-8 text-center text-xs text-slate-400">目前沒有任務（SoT 為空則保持空白）</div>`;
  } else if (currentTab === 'kanban') {
    const cols = [
      { key: 'todo', label: '📋 待辦' },
      { key: 'in-progress', label: '⚡ 進行中' },
      { key: 'blocked', label: '⛔ 受阻' },
      { key: 'done', label: '✅ 完成' }
    ];
    container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">${cols.map(c => `
      <div class="panze-card rounded-xl p-3.5 space-y-3">
        <div class="font-bold text-xs text-slate-700 dark:text-slate-300 px-1 flex items-center justify-between">
          <span>${c.label}</span>
          <span class="text-[10px] mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-950 text-slate-500">${filtered.filter(t => t.status === c.key).length}</span>
        </div>
        <div class="space-y-3">${filtered.filter(t => t.status === c.key).map(renderTaskCard).join('') || '<div class="text-[11px] text-slate-500 px-1">空</div>'}</div>
      </div>`).join('')}</div>`;
  } else if (currentTab === 'decisions') {
    const decs = (state.decisions || []).filter(d => activeProject === 'ALL' || d.projectId === activeProject);
    container.innerHTML = decs.length ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${decs.map(d => `
      <div class="panze-card rounded-xl p-4 space-y-2">
        <div class="flex justify-between gap-2"><span class="text-[11px] font-semibold text-indigo-300">${d.projectId}</span><span class="text-[10px] text-emerald-400" title="${d.status}">${labelStatus(d.status)}</span></div>
        <h4 class="font-bold text-sm text-white">${d.title}</h4>
        <p class="text-xs text-slate-300 leading-relaxed">${d.decision}</p>
        <div class="text-[11px] text-slate-500">由 ${d.agent}</div>
      </div>`).join('')}</div>` : `<div class="panze-card rounded-xl p-8 text-center text-xs text-slate-400">目前沒有決策（SoT 為空則保持空白）</div>`;
  } else if (currentTab === 'links') {
    const links = (state.links || []).filter(l => activeProject === 'ALL' || l.projectId === activeProject);
    const envs = (state.environments || []).filter(e => activeProject === 'ALL' || e.projectId === activeProject);
    container.innerHTML = `
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="space-y-3">
          <h3 class="text-xs font-bold tracking-wider text-slate-400">外部連結</h3>
          ${links.map(l => `<a href="${l.url}" target="_blank" rel="noopener" class="panze-card rounded-xl p-3 block hover:border-indigo-500">
            <div class="text-[10px] mono text-indigo-400" title="${l.linkType}">${labelLinkType(l.linkType)} · ${l.projectId}</div>
            <div class="font-semibold text-sm text-white">${l.label}</div>
            <div class="text-[11px] text-slate-500 mono truncate">${l.url}</div>
          </a>`).join('') || '<div class="text-xs text-slate-500">目前沒有連結</div>'}
        </div>
        <div class="space-y-3">
          <h3 class="text-xs font-bold tracking-wider text-slate-400">環境</h3>
          ${envs.map(e => `<div class="panze-card rounded-xl p-3">
            <div class="flex justify-between"><span class="font-semibold text-sm">${healthDot(e.health)} ${e.name} <span class="text-[10px] text-slate-500">（${labelHealth(e.health)}）</span></span><span class="text-[10px] mono text-slate-400">${e.kind === 'staging' ? '測試環境' : e.kind === 'production' ? '正式環境' : (e.kind || '')}</span></div>
            <div class="text-[11px] text-slate-400">${e.provider || ''} · ${e.projectId}</div>
            ${e.url ? `<a class="text-[11px] text-indigo-400 mono" href="${e.url}" target="_blank" rel="noopener">${e.url}</a>` : ''}
          </div>`).join('') || '<div class="text-xs text-slate-500">目前沒有環境</div>'}
        </div>
      </div>`;
  }
}

window.addEventListener('load', () => {
  document.getElementById('btnThemeToggle').onclick = () => {
    document.documentElement.classList.toggle('dark');
    const dark = document.documentElement.classList.contains('dark');
    const icon = document.getElementById('themeIcon');
    const txt = document.getElementById('themeText');
    if (icon) icon.textContent = dark ? '🌙' : '☀️';
    if (txt) txt.textContent = dark ? '深色模式' : '淺色模式';
  };
  document.getElementById('btnGhModal').onclick = openModal;
  document.getElementById('btnCloseModal').onclick = closeModal;
  document.getElementById('btnCancelModal').onclick = closeModal;
  document.getElementById('btnSaveConfig').onclick = () => {
    ghConfig.owner = document.getElementById('ghOwner').value.trim();
    ghConfig.repo = document.getElementById('ghRepo').value.trim();
    ghConfig.branch = document.getElementById('ghBranch').value.trim();
    ghConfig.token = document.getElementById('ghToken').value.trim();
    localStorage.setItem('york_gh_config_v2', JSON.stringify(ghConfig));
    closeModal(); updateSyncUI();
    if (ghConfig.token) pushToGitHub(true);
  };
  document.getElementById('btnPush').onclick = () => pushToGitHub(true);
  document.getElementById('btnResetFilter').onclick = () => filterProject('ALL');
  document.getElementById('tabFocus').onclick = () => setTab('focus');
  document.getElementById('tabKanban').onclick = () => setTab('kanban');
  document.getElementById('tabDecisions').onclick = () => setTab('decisions');
  document.getElementById('tabLinks').onclick = () => setTab('links');
  document.getElementById('btnAddTask').onclick = () => {
    const title = document.getElementById('newTitle').value.trim();
    if (!title) return;
    state.tasks.unshift({
      id: 'local_' + Date.now(),
      projectId: document.getElementById('newProject').value,
      title,
      body: '（僅本機；未寫入 agent_sync）',
      status: 'in-progress',
      sotStatus: 'in_progress',
      isBlocker: false,
      aiTool: document.getElementById('newAiTool').value.trim() || 'local',
      blockedReason: ''
    });
    document.getElementById('newTitle').value = '';
    save();
  };
  render();
  updateSyncUI();
});
</script>
