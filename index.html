<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>York's AI Projects & Toolchain Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; transition: background-color 0.2s, color 0.2s; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    html.dark body { background: #070b12; color: #f1f5f9; }
    html.dark .panze-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
    html.dark .panze-card:hover { border-color: rgba(99, 102, 241, 0.6); }
    html.dark .panze-inner { background: rgba(2, 6, 23, 0.6); border-color: rgba(30, 41, 59, 0.8); }

    html:not(.dark) body { background: #f8fafc; color: #0f172a; }
    html:not(.dark) .panze-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); }
    html:not(.dark) .panze-card:hover { border-color: #6366f1; box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.1); }
    html:not(.dark) .panze-inner { background: #f1f5f9; border-color: #e2e8f0; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-slate-950/80 backdrop-blur sticky top-0 z-30 px-5 py-3.5 transition-colors">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-500/20">⚡</div>
        <div>
          <h1 class="font-bold text-sm tracking-wide text-slate-900 dark:text-white">PANZE STUDIO // AI COMMAND CENTER</h1>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">Single Source of Truth · 專案連結 & 程式庫導航 · Supabase Realtime 共享中樞</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="syncStatus" class="text-[11px] px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-800">檢查中...</span>
        <button id="btnThemeToggle" type="button" class="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-medium cursor-pointer transition flex items-center gap-1.5">
          <span id="themeIcon">🌙</span>
          <span id="themeText" class="hidden sm:inline">深色模式</span>
        </button>
        <button id="btnConfigModal" type="button" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-medium cursor-pointer transition">⚙️ 雲端設定 (Supabase & GitHub)</button>
        <button id="btnPush" type="button" class="text-xs px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium shadow-md shadow-indigo-600/25 cursor-pointer transition">💾 立即推送</button>
      </div>
    </div>
  </header>

  <!-- 雲端與 Supabase 同步設定 Modal -->
  <div id="configModal" style="display: none;" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2">
        <h3 class="text-sm font-bold text-slate-900 dark:text-white">⚙️ 雲端即時同步中樞設定</h3>
        <button id="btnCloseConfig" type="button" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-base font-bold p-1">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div class="bg-indigo-50 dark:bg-indigo-950/30 p-2.5 rounded-lg border border-indigo-200 dark:border-indigo-500/20 text-indigo-800 dark:text-indigo-300">
          💡 <strong>Supabase 共享中樞</strong>：填入後啟動全球 WebSocket Realtime 即時雙向同步，任何終端修改均在 1 秒內更新。
        </div>
        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1">Supabase Project URL</label>
          <input id="sbUrl" type="text" placeholder="https://xxxx.supabase.co" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white mono">
        </div>
        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1">Supabase Anon Public Key</label>
          <input id="sbKey" type="password" placeholder="eyJhbGciOi..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white mono">
        </div>
        <hr class="border-slate-200 dark:border-slate-800 my-2">
        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1">GitHub Personal Access Token (選填備份用)</label>
          <input id="ghToken" type="password" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white mono">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
        <button id="btnCancelConfig" type="button" class="px-3 py-1.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs">取消</button>
        <button id="btnSaveConfig" type="button" class="px-3.5 py-1.5 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold">儲存並連接 Supabase</button>
      </div>
    </div>
  </div>

  <!-- 新增專案 Modal -->
  <div id="addProjectModal" style="display: none;" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2">
        <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-1.5">🚀 新增專案 (Add Project Manually)</h3>
        <button id="btnCloseProjModal" type="button" class="text-slate-400 hover:text-slate-700 dark:hover:text-white text-base font-bold p-1">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">專案代號 (ID, 英文唯一值)</label>
            <input id="projNewId" type="text" placeholder="例如: my-ai-agent" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white mono">
          </div>
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">專案名稱 (含 Emoji)</label>
            <input id="projNewName" type="text" placeholder="例如: 🤖 AI 客服中樞" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white">
          </div>
        </div>
        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1">一句話定位與簡介</label>
          <input id="projNewDesc" type="text" placeholder="例如: 結合 Claude MCP 與 WhatsApp API 的自動化客服流程" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white">
        </div>
        
        <!-- 專案連結配置 -->
        <div class="grid grid-cols-3 gap-2.5 bg-slate-50 dark:bg-slate-950/60 p-2.5 rounded-lg border border-slate-200 dark:border-slate-800">
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">🌐 Production URL</label>
            <input id="projNewProdUrl" type="url" placeholder="https://..." class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded px-2.5 py-1.5 text-slate-900 dark:text-white mono text-[11px]">
          </div>
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">🧪 Testing URL</label>
            <input id="projNewTestUrl" type="url" placeholder="https://..." class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded px-2.5 py-1.5 text-slate-900 dark:text-white mono text-[11px]">
          </div>
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">🐙 GitHub Repo</label>
            <input id="projNewGithub" type="text" placeholder="user/repo" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded px-2.5 py-1.5 text-slate-900 dark:text-white mono text-[11px]">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">起始階段</label>
            <select id="projNewPhase" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white">
              <option value="1">Phase 1: 需求釐清</option>
              <option value="2" selected>Phase 2: MVP 原型</option>
              <option value="3">Phase 3: 實測反饋</option>
              <option value="4">Phase 4: 變現驗證</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-500 dark:text-slate-400 mb-1">健康狀態</label>
            <select id="projNewStatus" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded px-3 py-2 text-slate-900 dark:text-white">
              <option value="ontrack">🟢 On Track (順暢)</option>
              <option value="active" selected>🟡 Active (積極推進)</option>
              <option value="review">🔴 Review (需覆核/卡關)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-slate-500 dark:text-slate-400 mb-1">
            專用 AI 工具鏈 (每行格式: <span class="mono text-indigo-500">工具名稱: 負責角色</span>)
          </label>
          <textarea id="projNewTools" rows="2" placeholder="Grok Build: 策略與變更集生成&#10;Futu OpenD: 模擬行情與下單接口" class="w-full
